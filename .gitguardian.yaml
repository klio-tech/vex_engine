version: 2

# Narrow, explained secret-scanning exceptions only. Do NOT add blanket
# patterns like 'tests/**/*' here — real credentials do leak into test
# files, and this repo relies on GitGuardian to catch that. Every entry below
# must name a specific file and say, in a comment, exactly what the flagged
# value is and why it is not a live credential.
secret:
  ignored_paths:
    # services/dashboard-api/tests/ws_auth_fixtures.py
    #
    # Contains TEST_VECTOR: a fixed HMAC-SHA256 signature computed over a
    # hardcoded, non-secret input ("test-secret-do-not-use" /
    # "11111111-2222-3333-4444-555555555555" / a fixed timestamp). It is a
    # cross-language drift check — this service's Python token verifier
    # (services/dashboard-api/app/ws_auth.py) and the Dashboard repo's
    # TypeScript minter (apps/web/lib/agentguard/ws-token.fixture.ts) both
    # assert this exact byte string, so an encoding/padding/separator change
    # on either side fails CI instead of shipping as "the live charts
    # silently stopped updating". The 43-char base64url signature is
    # structurally indistinguishable from a live token to pattern-based
    # scanning, which is why it is flagged here despite signing nothing that
    # runs in production. Do not delete the fixture or the cross-language
    # test that depends on it; if you change the values, update them
    # identically in the Dashboard repo.
    - 'services/dashboard-api/tests/ws_auth_fixtures.py'
