[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vex-shared"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "litellm>=1.0.0",
    "boto3>=1.29.0",
]

[project.optional-dependencies]
# Tree-sitter grammars for the code compressor. Optional because they require
# Python 3.10+ while this package still supports 3.9, and because the
# compressor degrades to passthrough without them rather than failing.
code = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-go>=0.25,<0.26",
]
# The prose model. Deliberately NOT a default dependency: onnxruntime plus the
# weights is ~350 MB, which is not something to put in every image for a
# compressor that reports single-digit savings. Install it where prose
# compression is actually wanted; everywhere else it passes through.
prose = [
    "onnxruntime>=1.17",
    "tokenizers>=0.20",
    "huggingface-hub>=0.24",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "vex-shared[code]",
]

# Registers shared.testing.db_gate as a pytest plugin wherever vex-shared is
# installed. That is what lets services/migrations/tests — which installs no
# package of its own — honour the same KLIO_REQUIRE_DB gate as everything else.
[project.entry-points.pytest11]
klio_db_gate = "shared.testing.db_gate"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
