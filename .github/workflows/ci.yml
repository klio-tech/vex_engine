name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint check
        run: ruff check services/
      - name: Ruff format check
        run: ruff format --check services/

  service-tests:
    name: Service Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        service: [shared, ingestion-api, storage-worker, dashboard-api, verification-engine, sync-gateway, async-worker, alert-service, mcp-server]
        include:
          - service: sync-gateway
            extra_deps: services/verification-engine
          - service: async-worker
            extra_deps: services/verification-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared models
        run: pip install -e services/shared
      - name: Install verification engine (if needed)
        if: matrix.extra_deps != ''
        run: pip install -e ${{ matrix.extra_deps }}
      - name: Install service
        run: pip install -e "services/${{ matrix.service }}[dev]"
      - name: Run tests
        run: pytest services/${{ matrix.service }}/tests/ -v --tb=short
