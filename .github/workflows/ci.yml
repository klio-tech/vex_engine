name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pinned deliberately. An unpinned install picks up whatever ruff was
        # released that morning, so a new version's rules turn CI red on code
        # nobody touched — 0.16.0 did exactly that (403 errors across the repo,
        # blocking unrelated PRs). Bump this on purpose, with the resulting
        # fixes in the same commit.
        run: pip install ruff==0.15.4
      - name: Ruff lint check
        run: ruff check services/
      - name: Ruff format check
        run: ruff format --check services/

  service-tests:
    name: Service Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint]
    # Every tenancy-boundary suite in this repo needs a real Postgres, because
    # the boundary IS the SQL: a mocked session would pass against a query with
    # no WHERE clause at all. This job used to have no database. The suites
    # noticed, skipped themselves, and the job went green — 112 adversarial
    # tests (graph isolation, user silo, compression cache, curator, migrations)
    # reported as "skipped" and nobody read the number.
    #
    # The image matches docker-compose.yml so the extensions the migrations
    # create (pgvector, timescaledb) are the same ones production has.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: agentguard
          POSTGRES_USER: agentguard
          POSTGRES_PASSWORD: agentguard_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agentguard:agentguard_dev@localhost:5432/agentguard
      # The second half of the fix, and the half that cannot be skipped past.
      # A Postgres service can break — image pull, port clash, a health check
      # that lies — and without this the suites would quietly go back to
      # skipping and the check would go back to green. With it set, an
      # unreachable database fails every test that needed one. See
      # services/shared/shared/testing/db_gate.py.
      KLIO_REQUIRE_DB: "1"
    strategy:
      fail-fast: false
      matrix:
        service: [shared, ingestion-api, storage-worker, dashboard-api, verification-engine, sync-gateway, async-worker, alert-service, mcp-server]
        include:
          - service: sync-gateway
            extra_deps: services/verification-engine
          - service: async-worker
            extra_deps: services/verification-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared models
        # [code] pulls the tree-sitter grammars (~4.5 MB). Without them the
        # code compressor degrades to passthrough, `lossy` comes back False and
        # four compress tests in mcp-server fail rather than skip. The
        # production mcp-server Dockerfile installs the same grammars, so this
        # matches production. [prose] is deliberately NOT installed: the
        # Dockerfile omits it too (~350 MB of onnxruntime plus weights).
        run: pip install -e "services/shared[code]"
      - name: Install verification engine (if needed)
        if: matrix.extra_deps != ''
        run: pip install -e ${{ matrix.extra_deps }}
      - name: Install service
        run: pip install -e "services/${{ matrix.service }}[dev]"
      - name: Install alembic
        run: pip install "alembic>=1.12.0" "psycopg2-binary>=2.9.0"
      - name: Migrate the test database
        working-directory: services/migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest services/${{ matrix.service }}/tests/ -v --tb=short

  migration-tests:
    name: Migration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    # Its own job rather than a `service-tests` matrix entry: services/migrations
    # ships no importable package (hatchling has nothing to build a wheel from)
    # and declares no [dev] extra, so the matrix's
    # `pip install -e "services/<svc>[dev]"` step cannot install it. The suite
    # is still the only thing that exercises the upgrade/downgrade cycle and
    # the CHECK constraints against a real server, so it gets a real database
    # and the same KLIO_REQUIRE_DB gate.
    #
    # POSTGRES_USER is the image's superuser, so `agentguard` has CREATEDB.
    # The downgrade round-trip tests need it: they create and drop their own
    # scratch database rather than moving a shared schema up and down, and
    # their fixture errors rather than skips without the privilege. Do not
    # replace this with a lesser role for tests.
    #
    # KLIO_ALLOW_AUDIT_LOSS is deliberately NOT set here: a test asserts that a
    # destructive audit-table downgrade is refused when it is absent.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: agentguard
          POSTGRES_USER: agentguard
          POSTGRES_PASSWORD: agentguard_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agentguard:agentguard_dev@localhost:5432/agentguard
      KLIO_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared
        # Not for the models — for the pytest11 entry point that registers the
        # requires_db gate. Without it these tests would skip on a dead
        # database exactly the way they used to.
        run: pip install -e services/shared
      - name: Install migration tooling
        run: pip install "alembic>=1.12.0" "psycopg2-binary>=2.9.0" "sqlalchemy>=2.0.0,<2.1" pytest
      - name: Migrate the test database
        working-directory: services/migrations
        run: alembic upgrade head
      - name: Run tests
        working-directory: services/migrations
        run: pytest tests/ -v --tb=short

  container-import:
    name: Container Import (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint]
    # Builds each service image and imports its entrypoint module.
    #
    # This exists because `service-tests` cannot catch a missing runtime
    # dependency. Those tests run under `pip install -e services/<svc>[dev]`
    # in a venv that already has every transitive package, while the images
    # hand-maintain their own dependency lists — see the pip block in
    # services/mcp-server/Dockerfile.
    #
    # On 2026-07-30 that gap took mcp.klio.tech down for ~35 minutes: boto3
    # was added to services/shared/pyproject.toml but not to the mcp-server
    # Dockerfile's copy of shared's deps. `mcp_app` imports artifact_storage
    # at module scope, which imports boto3 at module scope, so the container
    # crash-looped on start. All 282 tests were green throughout.
    #
    # Importing the entrypoint is what makes this bite: a module-scope import
    # error is exactly the failure that reaches production as a crash loop
    # rather than as a handled error at first use.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: mcp-server
            import: app.main
          - service: ingestion-api
            import: app.main
          - service: dashboard-api
            import: app.main
          - service: sync-gateway
            import: app.main
          - service: storage-worker
            import: app.main
          - service: async-worker
            import: app.main
          - service: alert-service
            import: app.main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: klio-${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Import ${{ matrix.import }} inside the image
        # No database, broker or network is available here, so this asserts
        # only that every module-scope import resolves. That is the whole
        # point: anything needing a live dependency belongs behind a function
        # call, not at import time.
        run: |
          docker run --rm --network none klio-${{ matrix.service }}:ci \
            python -c "import ${{ matrix.import }}; print('import OK: ${{ matrix.import }}')"
